Section "ServerLayout"
    Identifier "L"
    Screen 0 "S"
EndSection
Section "Device"
    Identifier "D"
    Driver "nvidia"
    Option "AllowEmptyInitialConfiguration" "True"
    Option "ConnectedMonitor" "DFP-0"
    Option "UseDisplayDevice" "None"
    Option "HardDPMS" "false"
EndSection
Section "Screen"
    Identifier "S"
    Device "D"
    DefaultDepth 24
    SubSection "Display"
        Depth 24
        Virtual 1920 1080
    EndSubSection
EndSection

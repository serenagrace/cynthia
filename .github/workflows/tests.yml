name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Check formatting
        run: |
          isort --check-only .
          black --check --target-version py311 .

      # Live Discord checks need a real test bot and are skipped in CI
      - name: Run tests
        run: python -m pytest -m "not discord_live"

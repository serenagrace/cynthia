name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      # nxbt depends on dbus-python, which builds against the system libdbus
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libdbus-1-dev libglib2.0-dev pkg-config

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Check formatting
        run: |
          isort --check-only .
          black --check --target-version py311 .

      # Live Discord checks need a real test bot and are skipped in CI
      - name: Run tests
        run: python -m pytest -m "not discord_live"

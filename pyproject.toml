[build-system]
requires = ["setuptools >= 77.0.3"]
build-backend = "setuptools.build_meta"
[project]
name="cynthia"
version="1.5.9"
requires-python="==3.14.11"
dependencies = [
    "about-time==4.2.1",
    "cynthia",
    "discord-py",
    "grapheme==0.6.0",
    "nxbt @ git+https://github.com/serenagrace/nxbt@cynthia-patches",
    "python-dotenv==1.1.0",
    "pyyaml==6.0.2",
    "pyotp",
    "rapidfuzz",
    "requests-async",
    "roku",
    "uvicorn",
    "scikit-image",
    "paddleocr==2.7.3",
    "paddlepaddle==2.6.2",
    "fastapi",
    "xxhash==3.7.0",
    "numpy<2.0.0",
    "opencv-python-headless<4.10"
]

[project.optional-dependencies]
dev = ["black", "isort", "pytest"]

[project.scripts]
cynthia="cynthia.__main__:main"

[tool.setuptools]
py-modules=["cynthia"]

[tool.isort]
profile = "black"
py_version = 311
skip_gitignore = true
skip = ["env", "build", "dist"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["discord_live: opt-in, read-only checks against the configured test bot"]
filterwarnings = ["ignore:'audioop' is deprecated and slated for removal in Python 3\\.13:DeprecationWarning:discord\\.player"]

[build-system]
requires = ["setuptools >= 84.2.1"]
build-backend = "setuptools.build_meta"
[project]
name="cynthia"
version="1.9.1"
description="Discord bot with wired and Bluetooth Nintendo Switch automation, capture, and streaming"
readme="README.md"
license="GPL-3.0-or-later"
license-files=["LICENSE"]
authors=[{name="serenagrace"}]
classifiers=[
    "Programming Language :: Python :: 3.11",
    "Operating System :: POSIX :: Linux",
]
requires-python=">=3.11,<3.12"
dependencies = [
    "discord-py[voice]",
    "nxbt @ git+https://github.com/serenagrace/nxbt@cynthia-patches",
    "python-dotenv==1.2.4",
    "pyyaml==6.0.2",
    "pyotp",
    "rapidfuzz",
    "yt-dlp",
    "requests-async",
    "uvicorn",
    "scikit-image",
    "paddleocr==3.7.0",
    "fastapi",
    "obsws-python>=1.8.1",
    "xxhash==4.0.2",
    "numpy<2.0.0",
    "opencv-python-headless<5.1",
    "better-profanity==0.7.0",
    "piper-tts==1.8.0"
]

[project.optional-dependencies]
# Pick exactly one paddle build: `pip install -e ".[cpu]"` or `-e ".[gpu]"`.
# The GPU wheel is hosted on Paddle's own index; see README for the extra index URL.
cpu = ["paddlepaddle==3.2.2"]
gpu = ["paddlepaddle-gpu==3.2.2"]
dev = ["black", "isort", "pytest", "build"]
cyclient = ["pypresence", "requests"]

[project.urls]
Homepage="https://github.com/serenagrace/cynthia"
Documentation="https://serenegrace.io/docs/cynthia/"
Issues="https://github.com/serenagrace/cynthia/issues"

[project.scripts]
cynthia="cynthia.__main__:main"

[tool.setuptools]
include-package-data = false

[tool.setuptools.package-data]
"cynthia.daemons" = [
    "scenes/bdsp_route_202.png",
    "scenes/bdsp_run.png",
    "scenes/bdsp_tbox.png",
    "scenes/elgato_no_signal.png",
    "scenes/quick_settings_sleep.png",
    "scenes/roamer.png",
    "scenes/switch_boot_screen.png",
    "scenes/switch_change_grip_order.png",
    "scenes/switch_home_screen.png",
    "scenes/switch_home_screen_afk.png",
]

"cynthia.site" = [
    "html/*.html",
    "static/*",
]

[tool.setuptools.packages.find]
include = ["cynthia*"]

[tool.isort]
profile = "black"
py_version = 311
skip_gitignore = true
skip = ["env", "build", "dist"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["discord_live: opt-in checks with temporary changes to the configured test bot and guild"]
filterwarnings = [
    "ignore:'audioop' is deprecated and slated for removal in Python 3\\.13:DeprecationWarning:discord\\.player",
    "ignore:pkg_resources is deprecated as an API:DeprecationWarning",
    "ignore:'imghdr' is deprecated and slated for removal in Python 3\\.13:DeprecationWarning",
]

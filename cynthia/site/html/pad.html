<style>
        .controller-pad {
            display: block;
            width: 100%;
            height: auto;
        }

        .pad-key {
            color: #a0a0ad;
            transition: color 0.05s;
        }

        .pad-key .button {
            fill: #34343e;
            stroke: #555560;
            stroke-width: 2;
            transition: fill 0.05s, stroke 0.05s;
        }

        .pad-key .label {
            fill: currentColor;
            font: 600 13px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            text-anchor: middle;
            dominant-baseline: central;
            pointer-events: none;
        }

        .pad-key.on {
            color: #ffffff;
        }

        .pad-key.on .button {
            fill: #3a6ff0;
            stroke: #9db7ff;
        }

        .controller-body {
            fill: #23232a;
            stroke: #41414d;
            stroke-width: 3;
        }

        .controller-detail {
            fill: #1b1b20;
            stroke: #383842;
            stroke-width: 2;
        }
</style>

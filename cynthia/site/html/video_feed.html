<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>CyStream</title>
        <link rel="icon" type="image/x-icon" href="/favicon.ico">
        <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #121214;
            color: #e1e1e6;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        /* Layout: side panels left of the feed when wide, below it otherwise */
        .layout {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
            max-width: 100%;
        }

        .side {
            display: flex;
            flex-direction: column;
            gap: 16px;
            width: 100%;
        }

        .side:not(:has(> :not([hidden]))) {
            display: none;
        }

        /* Below the feed the panels get a width of their own. If it followed the
           picture, text wrapping would change their height, which changes the
           picture's size, and the layout would flip between two sizes forever. */
        @media (max-width: 1099.98px) {
            .layout {
                width: 100%;
            }
            .side {
                max-width: 760px;
            }
        }

        @media (min-width: 1100px) {
            .layout {
                flex-direction: row-reverse;
                align-items: flex-start;
            }
            .side {
                width: 300px;
                flex: none;
            }
        }

        /* Stream Container Card */
        .stream-card {
            background: #1d1d22;
            border: 1px solid #2e2e38;
            border-radius: 12px;
            padding: 24px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            display: flex;
            flex-direction: column;
            align-items: center;
            max-width: 100%;
            min-width: 0;
        }

        [hidden] {
            display: none !important;
        }

        /* Video Display Box */
        .video-wrapper {
            background-color: #09090a;
            border-radius: 8px;
            overflow: hidden;
            position: relative;
            aspect-ratio: 16 / 9;
            /* The width follows from the height that fits; capping the height
               instead would leave the picture letterboxed. --reserve is set by
               script when the panels sit below the feed. The wrapper owns the
               size, so it stays put while the server restarts and no picture
               is showing. */
            width: calc((100vh - 136px - var(--reserve, 0px)) * 16 / 9);
            max-width: 100%;
            margin: 0 auto;
        }

        .video-wrapper img, #rtc {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            display: block;
            object-fit: contain;
        }

        #feed:not([src]), #feed.broken {
            visibility: hidden;
        }

        .toggle {
            position: fixed;
            right: 12px;
            bottom: 12px;
            width: 28px;
            height: 28px;
            padding: 0;
            background: transparent;
            color: #8d8d99;
            border: none;
            border-radius: 50%;
            cursor: pointer;
            font: inherit;
            font-size: 1.1rem;
            line-height: 1;
            opacity: 0.4;
        }

        #ssim-toggle {
            opacity: 0.65;
        }

        #input-pane .controller-pad {
            width: 220px;
            max-width: 100%;
            margin: 0 auto;
        }

        .toggle:hover, .toggle[aria-pressed="true"] {
            background: #232329;
            opacity: 1;
        }

        .ssim-row {
            display: flex;
            justify-content: space-between;
            gap: 16px;
            font-variant-numeric: tabular-nums;
            font-size: 0.9rem;
            padding: 3px 0;
        }

        .ssim-title {
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: #8d8d99;
            margin-bottom: 6px;
        }

        /* Bot status pane */
        .status-pane {
            width: 100%;
            padding: 14px 16px;
            background: #16161a;
            border: 1px solid #2e2e38;
            border-radius: 8px;
        }

        .status-game {
            font-size: 1.05rem;
            font-weight: 600;
            color: #ffffff;
        }

        .status-details {
            margin-top: 2px;
            font-size: 0.9rem;
            color: #a8a8b3;
        }

        .stats {
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-top: 12px;
            padding-top: 12px;
            border-top: 1px solid #2e2e38;
        }

        .stat {
            display: flex;
            align-items: baseline;
            gap: 10px;
        }

        .stat-label {
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: #8d8d99;
        }

        .stat-value {
            font-size: 1.1rem;
            font-weight: 600;
            font-variant-numeric: tabular-nums;
            color: #e1e1e6;
        }

        /* Controller input display */

        /* Right to left: stats, SSIM, inputs, mute, volume slider */
        #ssim-toggle {
            right: 48px;
        }
        .toggle.second {
            right: 84px;
        }
        .toggle.third {
            right: 120px;
        }

        #stats-pane {
            position: fixed;
            top: 12px;
            left: 12px;
            z-index: 5;
            min-width: 230px;
            padding: 10px 12px;
            background: rgba(20, 20, 24, 0.88);
            border: 1px solid #34343e;
            border-radius: 8px;
            font: 0.78rem/1.55 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
            font-variant-numeric: tabular-nums;
            color: #c9c9d3;
            pointer-events: none;
        }

        #stats-pane[hidden] {
            display: none;
        }

        #stats-pane .stat {
            display: flex;
            justify-content: space-between;
            gap: 16px;
        }

        #stats-pane .stat b {
            color: #9db7ff;
            font-weight: 600;
        }

        #stats-pane h4 {
            margin: 8px 0 2px;
            font-size: 0.7rem;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: #8d8d99;
        }

        #stats-pane h4:first-child {
            margin-top: 0;
        }

        #volume {
            --fill: 80%;
            position: fixed;
            right: 156px;
            bottom: 12px;
            width: 96px;
            height: 28px;
            margin: 0;
            background: transparent;
            cursor: pointer;
            opacity: 0.55;
            transition: opacity 0.2s;
            -webkit-appearance: none;
            appearance: none;
        }

        #volume:hover, #volume:focus-visible {
            opacity: 1;
            outline: none;
        }

        #volume::-webkit-slider-runnable-track {
            height: 4px;
            border-radius: 2px;
            background: linear-gradient(to right, #9db7ff var(--fill), #34343e var(--fill));
        }

        #volume::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 12px;
            height: 12px;
            margin-top: -4px;
            border: none;
            border-radius: 50%;
            background: #ffffff;
            box-shadow: 0 0 0 0 rgba(157, 183, 255, 0.35);
            transition: transform 0.15s, box-shadow 0.15s;
        }

        #volume:hover::-webkit-slider-thumb, #volume:active::-webkit-slider-thumb {
            transform: scale(1.2);
            box-shadow: 0 0 0 5px rgba(157, 183, 255, 0.25);
        }

        #volume::-moz-range-track {
            height: 4px;
            border-radius: 2px;
            background: #34343e;
        }

        #volume::-moz-range-progress {
            height: 4px;
            border-radius: 2px;
            background: #9db7ff;
        }

        #volume::-moz-range-thumb {
            width: 12px;
            height: 12px;
            border: none;
            border-radius: 50%;
            background: #ffffff;
            transition: transform 0.15s, box-shadow 0.15s;
        }

        #volume:hover::-moz-range-thumb, #volume:active::-moz-range-thumb {
            transform: scale(1.2);
            box-shadow: 0 0 0 5px rgba(157, 183, 255, 0.25);
        }
        </style>
    </head>
    <body>

        <div class="layout">
            <div class="stream-card">
                <div class="video-wrapper">
                    <!-- Video Stream Feed -->
                    <img id="feed" width="640" height="480" alt="" aria-label="Live Video Feed">
                    <video id="rtc" width="640" height="480" autoplay playsinline muted hidden></video>
                </div>
                </div>
            <button class="toggle" id="ssim-toggle" type="button" title="Show SSIM scores" aria-label="Show SSIM scores" aria-pressed="false">&#129504;</button>
            <button class="toggle stats" id="stats-toggle" type="button" title="Show stats for nerds" aria-label="Show stats for nerds" aria-pressed="false">&#128295;</button>
            <div id="stats-pane" hidden></div>
            <button class="toggle third" id="mute-toggle" type="button" title="Unmute audio" aria-label="Unmute audio" aria-pressed="false">&#128263;</button>
            <input id="volume" type="range" min="0" max="100" step="1" value="80" title="Volume" aria-label="Volume" hidden>
            <audio id="audio" preload="none"></audio>

            <button class="toggle second" id="input-toggle" type="button" title="Show inputs" aria-label="Show inputs" aria-pressed="false">&#127918;</button>


            <div class="side" id="side">
                <!-- Hidden unless the bot reports an activity -->
                <div class="status-pane" id="status-pane" hidden>
                    <div class="status-game" id="st-game"></div>
                    <div class="status-details" id="st-details" hidden></div>
                    <div class="stats">
                        <div class="stat" id="stat-count" hidden>
                            <span class="stat-label" id="st-count-label">Resets</span>
                            <span class="stat-value" id="st-count"></span>
                        </div>
                        <div class="stat" id="stat-hunt" hidden>
                            <span class="stat-label">Hunting for</span>
                            <span class="stat-value" id="st-hunt"></span>
                        </div>
                        <div class="stat" id="stat-uptime" hidden>
                            <span class="stat-label">Bot uptime</span>
                            <span class="stat-value" id="st-uptime"></span>
                        </div>
                        <div class="stat" id="stat-avg" hidden>
                            <span class="stat-label">Avg time per encounter</span>
                            <span class="stat-value" id="st-avg"></span>
                        </div>
                        <div class="stat" id="stat-last" hidden>
                            <span class="stat-label">Since last encounter</span>
                            <span class="stat-value" id="st-last"></span>
                        </div>
                        <div class="stat">
                            <span class="stat-label">Viewers</span>
                            <span class="stat-value" id="viewer-count">–</span>
                        </div>
                    </div>
                </div>

                <div class="status-pane" id="input-pane" hidden>
                    <div class="ssim-title">Inputs</div>
                    <!--PAD-->
                </div>

                <div class="status-pane" id="ssim-pane" hidden>
                    <div class="ssim-title">Top SSIM matches</div>
                    <div id="ssim-rows"></div>
                </div>
            </div>
        </div>

        <script>
        const $ = (id) => document.getElementById(id);
        let activityStats = {};

        // Two largest units: "1d 16h", "1h 28m", "5:15", "45s"
        function formatDuration(ms) {
            const total = Math.max(0, Math.floor(ms / 1000));
            const d = Math.floor(total / 86400);
            const h = Math.floor((total % 86400) / 3600);
            const m = Math.floor((total % 3600) / 60);
            const s = total % 60;
            if (d > 0) return `${d}d ${h}h`;
            if (h > 0) return `${h}h ${m}m`;
            if (m > 0) return `${m}:${String(s).padStart(2, "0")}`;
            return `${s}s`;
        }

        function tickStats() {
            const now = Date.now();
            // Stats exclude time not hunting: the correction is added to the start,
            // and the clock freezes at the stop time while the hunt is stopped.
            const huntEnd = activityStats.hunt_stopped_at ?? now;
            const huntStart = typeof activityStats.hunt_started === "number"
                ? activityStats.hunt_started + (activityStats.hunt_correction_ms || 0)
                : undefined;
            const rows = [
                ["stat-hunt", "st-hunt", huntStart, (v) => formatDuration(huntEnd - v)],
                ["stat-uptime", "st-uptime", activityStats.bot_started, (v) => formatDuration(now - v)],
                ["stat-avg", "st-avg", activityStats.average_interval_ms, formatDuration],
                ["stat-last", "st-last", activityStats.last_encounter, (v) => formatDuration(now - v)],
            ];
            for (const [box, out, value, fmt] of rows) {
                const ok = typeof value === "number";
                $(box).hidden = !ok;
                if (ok) $(out).textContent = fmt(value);
            }
        }

        function renderStatus(status) {
            const pane = $("status-pane");
            // Playing statuses carry no name, so the details line becomes the title
            const title = status && (status.name || status.details);
            if (!title) {
                pane.hidden = true;
                return;
            }

            $("st-game").textContent = title;
            const headline = status.name ? status.details : "";
            $("st-details").textContent = headline || "";
            $("st-details").hidden = !headline;

            // "123 resets" / "123 encounters" -> labelled number; anything else is shown as-is
            const match = /^(\d+)\s+(\w+)$/.exec(status.state || "");
            $("stat-count").hidden = !status.state;
            if (match) {
                $("st-count-label").textContent = match[2].charAt(0).toUpperCase() + match[2].slice(1);
                $("st-count").textContent = Number(match[1]).toLocaleString();
            } else if (status.state) {
                $("st-count-label").textContent = "Status";
                $("st-count").textContent = status.state;
            }

            pane.hidden = false;
        }

        async function updateStatus() {
            try {
                const res = await fetch("/api/user_status", { cache: "no-store" });
                if (!res.ok) throw new Error(res.status);
                renderStatus(await res.json());
            } catch (e) {
                // Keep the last known status on transient failures
            }
        }

        async function updateActivityStats() {
            try {
                const res = await fetch("/api/activity_stats", { cache: "no-store" });
                if (!res.ok) throw new Error(res.status);
                activityStats = await res.json();
                tickStats();
            } catch (e) {
                // Keep the last known stats on transient failures
            }
        }

        async function updateViewers() {
            try {
                const res = await fetch("/api/viewers", { cache: "no-store" });
                const data = await res.json();
                $("viewer-count").textContent = data.viewers;
            } catch (e) {
                $("viewer-count").textContent = "–";
            }
        }

        function refresh() {
            updateStatus();
            updateActivityStats();
            updateViewers();
        }

        // Reload the feed once the server comes back after being unreachable
        const feed = $("feed");
        let serverUp = true;

        function reloadFeed() {
            feed.src = "/api/stream_endpoint?t=" + Date.now();
        }

        // WebRTC carries picture and sound together; MJPEG plus a separate audio
        // stream is the fallback when the server can't offer it.
        const rtc = $("rtc");
        let rtcActive = false;
        let rtcPc = null;
        let rtcStarting = false;
        let rtcRetry = null;

        function closeRtc() {
            if (rtcPc) rtcPc.close();
            rtcPc = null;
            rtcActive = false;
            rtc.hidden = true;
            rtc.srcObject = null;
        }

        async function connectRtc() {
            const info = await (await fetch("/api/webrtc", { cache: "no-store" })).json();
            if (!info.enabled) return "off";
            const pc = new RTCPeerConnection();
            try {
                pc.addTransceiver("video", { direction: "recvonly" });
                pc.addTransceiver("audio", { direction: "recvonly" });
                const stream = new MediaStream();
                pc.ontrack = (e) => {
                    stream.addTrack(e.track);
                    rtc.srcObject = stream;
                };
                await pc.setLocalDescription(await pc.createOffer());
                await new Promise((resolve) => {
                    if (pc.iceGatheringState === "complete") return resolve();
                    pc.addEventListener("icegatheringstatechange", () => {
                        if (pc.iceGatheringState === "complete") resolve();
                    });
                    setTimeout(resolve, 2000);
                });
                let answer = null;
                // The feed needs a moment to start when nobody was watching
                for (let i = 0; i < 12 && !answer; i++) {
                    const res = await fetch("/api/whep", {
                        method: "POST",
                        headers: { "Content-Type": "application/sdp" },
                        body: pc.localDescription.sdp,
                    });
                    if (res.ok) answer = await res.text();
                    else await new Promise((r) => setTimeout(r, 1000));
                }
                if (!answer) throw new Error("no answer");
                await pc.setRemoteDescription({ type: "answer", sdp: answer });
            } catch (e) {
                pc.close();
                return "fail";
            }
            // Signalling goes through nginx, but media flows straight to the media
            // port; viewers who can't reach it would otherwise sit on a black frame.
            const connected = await new Promise((resolve) => {
                const done = () => {
                    if (pc.connectionState === "connected") resolve(true);
                    else if (["failed", "closed"].includes(pc.connectionState)) resolve(false);
                };
                pc.addEventListener("connectionstatechange", done);
                setTimeout(() => resolve(false), 8000);
                done();
            });
            if (!connected) {
                pc.close();
                return "unreachable";
            }
            pc.onconnectionstatechange = () => {
                if (pc === rtcPc && ["failed", "closed"].includes(pc.connectionState)) startFeed();
            };
            rtcPc = pc;
            return "ok";
        }

        const forceMjpeg = new URLSearchParams(location.search).get("transport") === "mjpeg";
        async function startFeed() {
            if (rtcStarting) return;
            rtcStarting = true;
            clearTimeout(rtcRetry);
            closeRtc();
            let state = "fail";
            try {
                state = forceMjpeg ? "off" : await connectRtc();
            } catch (e) {}
            if (state === "ok") {
                rtcActive = true;
                feed.removeAttribute("src");
                feed.hidden = true;
                rtc.hidden = false;
                rtc.volume = Number(volume.value) / 100;
                setMuted(muted);
            } else {
                feed.hidden = false;
                reloadFeed();
                if (state === "fail") rtcRetry = setTimeout(startFeed, 10000);
                if (state === "unreachable") rtcRetry = setTimeout(startFeed, 300000);
            }
            rtcStarting = false;
        }

        // Restart WebRTC if the picture freezes
        let rtcLastTime = -1;
        setInterval(() => {
            if (!rtcActive) return;
            if (rtc.currentTime === rtcLastTime) startFeed();
            rtcLastTime = rtc.currentTime;
        }, 4000);

        async function checkServer() {
            let up = false;
            try {
                up = (await fetch("/api/viewers", { cache: "no-store" })).ok;
            } catch (e) {}
            if (up && !serverUp) startFeed();
            serverUp = up;
        }

        feed.addEventListener("error", () => {
            serverUp = false;
            feed.classList.add("broken");
        });
        feed.addEventListener("load", () => feed.classList.remove("broken"));

        // Panels below the feed: reserve their height so both fit on screen
        const wide = window.matchMedia("(min-width: 1100px)");
        let lastReserve = null;
        function updateReserve() {
            const side = $("side");
            const reserve = Math.round(wide.matches ? 0 : side.getBoundingClientRect().height + (side.offsetParent && side.offsetHeight ? 16 : 0));
            if (reserve === lastReserve) return;
            lastReserve = reserve;
            document.documentElement.style.setProperty("--reserve", reserve + "px");
        }
        new ResizeObserver(updateReserve).observe($("side"));
        wide.addEventListener("change", updateReserve);

        // SSIM panel
        let ssimTimer = null;
        async function updateSsim() {
            try {
                const res = await fetch("/api/ssim_data?delayed=true", { cache: "no-store" });
                if (!res.ok) throw new Error(res.status);
                const data = await res.json();
                const rows = $("ssim-rows");
                rows.replaceChildren(...data.scores.map((s) => {
                    const row = document.createElement("div");
                    row.className = "ssim-row";
                    const name = document.createElement("span");
                    name.textContent = s.scene;
                    const val = document.createElement("span");
                    val.textContent = s.score.toFixed(4);
                    row.append(name, val);
                    return row;
                }));
                if (!data.scores.length) rows.textContent = "No data";
            } catch (e) {
                // Keep previous values on transient failures
            }
        }

        // Stats for nerds: server counters are differenced between polls to get rates
        let statsTimer = null;
        let lastStats = null;
        const statRow = (name, value) => `<div class="stat"><span>${name}</span><b>${value}</b></div>`;
        // Browser-side receive stats; the server's encoder counters only cover MJPEG
        let lastRtc = null;
        async function rtcVideoStats() {
            if (!rtcActive || !rtcPc) return null;
            let v = null;
            (await rtcPc.getStats()).forEach((r) => {
                if (r.type === "inbound-rtp" && r.kind === "video") v = r;
            });
            if (!v) return null;
            const now = performance.now();
            const prev = lastRtc;
            lastRtc = { at: now, decoded: v.framesDecoded };
            return {
                fps: prev ? (v.framesDecoded - prev.decoded) / ((now - prev.at) / 1000) : NaN,
                dropped: v.framesDropped,
                freezes: v.freezeCount,
                lost: v.packetsLost,
                jitter: v.jitter * 1000,
                buffer: v.jitterBufferEmittedCount
                    ? (v.jitterBufferDelay / v.jitterBufferEmittedCount) * 1000
                    : NaN,
            };
        }

        async function updateStats() {
            try {
                const rtcStats = await rtcVideoStats();
                const res = await fetch("/api/stream_stats", { cache: "no-store" });
                if (!res.ok) return;
                const s = await res.json();
                let rates = { capture: NaN, encoded: NaN, sent: NaN };
                if (lastStats) {
                    const secs = (s.server_ns - lastStats.server_ns) / 1e9;
                    if (secs > 0) {
                        rates = {
                            capture: (s.capture_seq - lastStats.capture_seq) / secs,
                            encoded: (s.encoded_frames - lastStats.encoded_frames) / secs,
                            sent: (s.sent_frames - lastStats.sent_frames) / secs,
                        };
                    }
                }
                lastStats = s;
                const fmt = (v, digits = 1) => (Number.isFinite(v) ? v.toFixed(digits) : "-");
                const lookups = s.cache_hits + s.cache_misses;
                const audio = $("audio");
                const buffered = audio.buffered && audio.buffered.length
                    ? audio.buffered.end(audio.buffered.length - 1) - audio.currentTime
                    : NaN;
                const natural = rtcActive
                    ? rtc.videoWidth + "x" + rtc.videoHeight
                    : $("feed").naturalWidth + "x" + $("feed").naturalHeight;
                $("stats-pane").innerHTML =
                    "<h4>Video</h4>"
                    + statRow("Transport", rtcActive ? "WebRTC" : "MJPEG")
                    + statRow("Resolution", natural)
                    + statRow("Capture fps", fmt(rates.capture))
                    + (rtcStats
                        ? statRow("Playback fps", fmt(rtcStats.fps))
                            + statRow("Dropped (browser)", rtcStats.dropped)
                            + statRow("Freezes", rtcStats.freezes)
                            + statRow("Packets lost", rtcStats.lost)
                            + statRow("Jitter", fmt(rtcStats.jitter, 1) + " ms")
                            + statRow("Jitter buffer", fmt(rtcStats.buffer, 0) + " ms")
                        : statRow("Encoded fps", fmt(rates.encoded))
                            + statRow("Delivered fps", fmt(rates.sent / Math.max(1, s.mjpeg_viewers)))
                            + statRow("Frame size", fmt(s.jpeg_kb) + " KB")
                            + statRow("JPEG encode", fmt(s.encode_ms, 2) + " ms")
                            + statRow("Cache hits", lookups ? fmt(100 * s.cache_hits / lookups, 0) + "%" : "-"))
                    + statRow("Dropped (capture)", s.capture_dropped)
                    + statRow("Capture age", s.capture_age_ms === null ? "-" : fmt(s.capture_age_ms, 0) + " ms")
                    + statRow("Stream delay", s.video_delay_ms + " ms")
                    + statRow("Viewers", s.viewers + " (" + s.webrtc_viewers + " WebRTC, " + s.mjpeg_viewers + " MJPEG)")
                    + statRow("CPU load (1/5/15m)", s.cpu_load.map((v) => fmt(v, 2)).join(" / ")
                        + " of " + s.cpu_count + " cores")
                    + "<h4>Audio</h4>"
                    + statRow("State", muted ? "muted" : audio.paused ? "paused" : "playing")
                    + statRow("Capture", s.audio.captured ? "live" : "idle")
                    + statRow("Listeners", s.audio.listeners)
                    + statRow("Buffered", fmt(buffered * 1000, 0) + " ms")
                    + statRow("Target lag", fmt(audioLag * 1000, 0) + " ms")
                    + statRow("Playback rate", fmt(audio.playbackRate, 2) + "x")
                    + statRow("Skipped", fmt(s.audio.skipped_bytes / 192000, 1) + " s");
            } catch (e) {
                // Keep the previous values on transient failures
            }
        }

        $("stats-toggle").addEventListener("click", () => {
            const pane = $("stats-pane");
            pane.hidden = !pane.hidden;
            const label = pane.hidden ? "Show stats for nerds" : "Hide stats for nerds";
            $("stats-toggle").title = label;
            $("stats-toggle").setAttribute("aria-label", label);
            $("stats-toggle").setAttribute("aria-pressed", String(!pane.hidden));
            clearInterval(statsTimer);
            lastStats = null;
            if (!pane.hidden) {
                updateStats();
                statsTimer = setInterval(updateStats, 1000);
            }
        });

        $("ssim-toggle").addEventListener("click", () => {
            const pane = $("ssim-pane");
            pane.hidden = !pane.hidden;
            const label = pane.hidden ? "Show SSIM scores" : "Hide SSIM scores";
            $("ssim-toggle").title = label;
            $("ssim-toggle").setAttribute("aria-label", label);
            $("ssim-toggle").setAttribute("aria-pressed", String(!pane.hidden));
            clearInterval(ssimTimer);
            if (!pane.hidden) {
                updateSsim();
                ssimTimer = setInterval(updateSsim, 1000);
            }
        });

        // Audio: the stream only connects while unmuted, so the server captures on demand
        let muted = true;
        // How far behind the live edge audio plays; derived from the video's own
        // delay so sound lines up with the picture without any manual setting.
        let audioLag = 0.25;
        async function syncAudioLag() {
            try {
                const res = await fetch("/api/sync", { cache: "no-store" });
                if (!res.ok) return;
                const ms = (await res.json()).video_latency_ms;
                if (typeof ms === "number") audioLag = Math.min(2, Math.max(0.1, ms / 1000 + 0.15));
            } catch (e) {
                // Keep the previous estimate
            }
        }
        const volume = $("volume");
        function applyVolume() {
            const value = Number(volume.value);
            volume.style.setProperty("--fill", value + "%");
            $("audio").volume = value / 100;
            rtc.volume = value / 100;
            localStorage.setItem("audioVolume", String(value));
        }
        volume.value = localStorage.getItem("audioVolume") ?? volume.value;
        volume.addEventListener("input", applyVolume);
        applyVolume();
        function setMuted(value) {
            muted = value;
            const audio = $("audio");
            const btn = $("mute-toggle");
            const label = muted ? "Unmute audio" : "Mute audio";
            btn.innerHTML = muted ? "&#128263;" : "&#128266;";
            btn.title = label;
            btn.setAttribute("aria-label", label);
            btn.setAttribute("aria-pressed", String(!muted));
            volume.hidden = muted;
            if (rtcActive) {
                audio.pause();
                audio.removeAttribute("src");
                audio.load();
                rtc.muted = muted;
                if (!muted) rtc.play().catch(() => setMuted(true));
                return;
            }
            if (muted) {
                audio.pause();
                audio.removeAttribute("src");
                audio.load();
            } else {
                syncAudioLag();
                audio.src = "/api/audio_stream?t=" + Date.now();
                audio.play().catch(() => setMuted(true));
            }
        }
        $("audio").addEventListener("error", () => {
            if (!muted) setTimeout(() => { if (!muted) setMuted(false); }, 3000);
        });
        $("mute-toggle").addEventListener("click", () => setMuted(!muted));
        // Browsers buffer live MP3 generously; skip ahead when playback falls behind,
        // and reconnect if it stalls for several seconds.
        let stalledTicks = 0;
        setInterval(() => {
            const audio = $("audio");
            if (muted || audio.paused || !audio.buffered.length) return;
            const end = audio.buffered.end(audio.buffered.length - 1);
            // Catch up by playing slightly faster; only seek when far behind
            const behind = end - audio.currentTime - audioLag;
            if (behind > 1.2) audio.currentTime = end - audioLag;
            else if (behind > 0.3) audio.playbackRate = 1.1;
            else if (behind < 0.1) audio.playbackRate = 1;
            stalledTicks = audio.readyState < 3 ? stalledTicks + 1 : 0;
            if (stalledTicks >= 8) {
                stalledTicks = 0;
                setMuted(false);
            }
        }, 500);
        setInterval(() => { if (!muted) syncAudioLag(); }, 15000);

        // Input display
        const padEls = {};
        for (const el of $("pad").querySelectorAll(".pad-key[id]")) {
            padEls[el.id] = el;
        }
        let inputTimer = null;
        async function updateInputs() {
            try {
                const res = await fetch("/api/inputs?delayed=true", { cache: "no-store" });
                if (!res.ok) throw new Error(res.status);
                const pressed = new Set((await res.json()).pressed);
                for (const [name, el] of Object.entries(padEls)) {
                    el.classList.toggle("on", pressed.has(name));
                }
            } catch (e) {
                // Keep previous state on transient failures
            }
        }

        function setInputsVisible(visible) {
            $("input-pane").hidden = !visible;
            const label = visible ? "Hide inputs" : "Show inputs";
            $("input-toggle").title = label;
            $("input-toggle").setAttribute("aria-label", label);
            $("input-toggle").setAttribute("aria-pressed", String(visible));
            clearInterval(inputTimer);
            if (visible) {
                updateInputs();
                inputTimer = setInterval(updateInputs, 100);
            }
            try { localStorage.setItem("showInputs", visible ? "1" : "0"); } catch (e) {}
        }
        $("input-toggle").addEventListener("click", () => setInputsVisible($("input-pane").hidden));
        try { if (localStorage.getItem("showInputs") === "1") setInputsVisible(true); } catch (e) {}

        refresh();
        setInterval(refresh, 3000);
        setInterval(checkServer, 2000);
        startFeed();
        setInterval(tickStats, 1000);
        </script>

    </body>
</html>

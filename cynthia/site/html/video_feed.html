<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>CyStream</title>
        <link rel="icon" type="image/x-icon" href="/favicon.ico">
        <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #121214;
            color: #e1e1e6;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        /* Layout: side panels left of the feed when wide, below it otherwise */
        .layout {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
            max-width: 100%;
        }

        .side {
            display: flex;
            flex-direction: column;
            gap: 16px;
            width: 100%;
        }

        .side:not(:has(> :not([hidden]))) {
            display: none;
        }

        @media (min-width: 1100px) {
            .layout {
                flex-direction: row-reverse;
                align-items: flex-start;
            }
            .side {
                width: 300px;
                flex: none;
            }
        }

        /* Stream Container Card */
        .stream-card {
            background: #1d1d22;
            border: 1px solid #2e2e38;
            border-radius: 12px;
            padding: 24px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            display: flex;
            flex-direction: column;
            align-items: center;
            max-width: 100%;
            min-width: 0;
        }

        [hidden] {
            display: none !important;
        }

        /* Video Display Box */
        .video-wrapper {
            background-color: #09090a;
            border-radius: 8px;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        img {
            display: block;
            max-width: 100%;
            height: auto;
            object-fit: contain;
            /* --reserve is set by script when the panels sit below the feed */
            max-height: calc(100vh - 136px - var(--reserve, 0px));
        }

        .toggle {
            position: fixed;
            right: 12px;
            bottom: 12px;
            width: 28px;
            height: 28px;
            padding: 0;
            background: transparent;
            color: #8d8d99;
            border: none;
            border-radius: 50%;
            cursor: pointer;
            font: inherit;
            font-size: 1.1rem;
            line-height: 1;
            opacity: 0.4;
        }

        .toggle:hover, .toggle[aria-pressed="true"] {
            background: #232329;
            opacity: 1;
        }

        .ssim-row {
            display: flex;
            justify-content: space-between;
            gap: 16px;
            font-variant-numeric: tabular-nums;
            font-size: 0.9rem;
            padding: 3px 0;
        }

        .ssim-title {
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: #8d8d99;
            margin-bottom: 6px;
        }

        /* Bot status pane */
        .status-pane {
            width: 100%;
            padding: 14px 16px;
            background: #16161a;
            border: 1px solid #2e2e38;
            border-radius: 8px;
        }

        .status-game {
            font-size: 1.05rem;
            font-weight: 600;
            color: #ffffff;
        }

        .status-details {
            margin-top: 2px;
            font-size: 0.9rem;
            color: #a8a8b3;
        }

        .stats {
            display: flex;
            flex-wrap: wrap;
            gap: 8px 32px;
            margin-top: 12px;
            padding-top: 12px;
            border-top: 1px solid #2e2e38;
        }

        .stat {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .stat-label {
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: #8d8d99;
        }

        .stat-value {
            font-size: 1.1rem;
            font-weight: 600;
            font-variant-numeric: tabular-nums;
            color: #e1e1e6;
        }

        /* Controller input display */
        .controller-pad {
            display: block;
            width: 100%;
            height: auto;
        }

        .pad-key {
            color: #a0a0ad;
            transition: color 0.05s;
        }

        .pad-key .button {
            fill: #34343e;
            stroke: #555560;
            stroke-width: 2;
            transition: fill 0.05s, stroke 0.05s;
        }

        .pad-key .label {
            fill: currentColor;
            font: 600 13px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            text-anchor: middle;
            dominant-baseline: central;
            pointer-events: none;
        }

        .pad-key.on {
            color: #ffffff;
        }

        .pad-key.on .button,
        .pad-key.on .stick-cap {
            fill: #3a6ff0;
            stroke: #9db7ff;
        }

        .controller-body {
            fill: #23232a;
            stroke: #41414d;
            stroke-width: 3;
        }

        .controller-detail {
            fill: #1b1b20;
            stroke: #383842;
            stroke-width: 2;
        }

        .stick-cap {
            fill: #292931;
            stroke: #62626f;
            stroke-width: 2;
        }

        .toggle.second {
            right: 48px;
        }

        .toggle.third {
            right: 84px;
        }
        </style>
    </head>
    <body>

        <div class="layout">
            <div class="stream-card">
                <div class="video-wrapper">
                    <!-- Video Stream Feed -->
                    <img id="feed" src="/api/stream_endpoint" width="640" height="480" alt="Live Video Feed">
                </div>
                </div>
            <button class="toggle" id="ssim-toggle" type="button" title="Show SSIM scores" aria-label="Show SSIM scores" aria-pressed="false">&#8943;</button>

            <button class="toggle second" id="input-toggle" type="button" title="Show inputs" aria-label="Show inputs" aria-pressed="false">&#127918;</button>

            <button class="toggle third" id="mute-toggle" type="button" title="Unmute audio" aria-label="Unmute audio" aria-pressed="false">&#128263;</button>
            <audio id="audio" preload="none"></audio>

            <div class="side" id="side">
                <!-- Hidden unless the bot reports an activity -->
                <div class="status-pane" id="status-pane" hidden>
                    <div class="status-game" id="st-game"></div>
                    <div class="status-details" id="st-details" hidden></div>
                    <div class="stats">
                        <div class="stat" id="stat-count" hidden>
                            <span class="stat-label" id="st-count-label">Resets</span>
                            <span class="stat-value" id="st-count"></span>
                        </div>
                        <div class="stat" id="stat-hunt" hidden>
                            <span class="stat-label">Hunting for</span>
                            <span class="stat-value" id="st-hunt"></span>
                        </div>
                        <div class="stat" id="stat-uptime" hidden>
                            <span class="stat-label">Bot uptime</span>
                            <span class="stat-value" id="st-uptime"></span>
                        </div>
                        <div class="stat" id="stat-avg" hidden>
                            <span class="stat-label">Avg time per encounter</span>
                            <span class="stat-value" id="st-avg"></span>
                        </div>
                        <div class="stat" id="stat-last" hidden>
                            <span class="stat-label">Since last encounter</span>
                            <span class="stat-value" id="st-last"></span>
                        </div>
                        <div class="stat">
                            <span class="stat-label">Viewers</span>
                            <span class="stat-value" id="viewer-count">–</span>
                        </div>
                    </div>
                </div>

                <div class="status-pane" id="input-pane" hidden>
                    <div class="ssim-title">Inputs</div>
                    <svg class="controller-pad" id="pad" viewBox="0 0 500 300" role="img" aria-label="Controller input display">
                        <path class="controller-body" d="M91 42h318c27 0 45 18 53 50l31 128c7 31-11 55-39 55-19 0-34-12-48-33l-30-45c-10-15-26-23-44-23H168c-18 0-34 8-44 23l-30 45c-14 21-29 33-48 33-28 0-46-24-39-55L38 92c8-32 26-50 53-50z"/>
                        <path class="controller-detail" d="M205 78h90a8 8 0 0 1 8 8v29h-106V86a8 8 0 0 1 8-8z"/>

                        <g class="pad-key" id="ZL" aria-label="ZL">
                            <title>ZL</title><rect class="button" x="83" y="52" width="72" height="23" rx="8"/><text class="label" x="119" y="64">ZL</text>
                        </g>
                        <g class="pad-key" id="L" aria-label="L">
                            <title>L</title><rect class="button" x="163" y="52" width="68" height="23" rx="8"/><text class="label" x="197" y="64">L</text>
                        </g>
                        <g class="pad-key" id="R" aria-label="R">
                            <title>R</title><rect class="button" x="269" y="52" width="68" height="23" rx="8"/><text class="label" x="303" y="64">R</text>
                        </g>
                        <g class="pad-key" id="ZR" aria-label="ZR">
                            <title>ZR</title><rect class="button" x="345" y="52" width="72" height="23" rx="8"/><text class="label" x="381" y="64">ZR</text>
                        </g>

                        <g class="pad-key" id="DPAD_UP" aria-label="D-pad up">
                            <title>D-pad up</title><rect class="button" x="119" y="109" width="32" height="32" rx="5"/><text class="label" x="135" y="125">↑</text>
                        </g>
                        <g class="pad-key" id="DPAD_LEFT" aria-label="D-pad left">
                            <title>D-pad left</title><rect class="button" x="85" y="143" width="32" height="32" rx="5"/><text class="label" x="101" y="159">←</text>
                        </g>
                        <g class="pad-key" id="DPAD_DOWN" aria-label="D-pad down">
                            <title>D-pad down</title><rect class="button" x="119" y="177" width="32" height="32" rx="5"/><text class="label" x="135" y="193">↓</text>
                        </g>
                        <g class="pad-key" id="DPAD_RIGHT" aria-label="D-pad right">
                            <title>D-pad right</title><rect class="button" x="153" y="143" width="32" height="32" rx="5"/><text class="label" x="169" y="159">→</text>
                        </g>

                        <g class="pad-key" id="L_STICK_PRESS" aria-label="Left stick press">
                            <title>Left stick press</title><circle class="button" cx="217" cy="174" r="31"/><circle class="stick-cap" cx="217" cy="174" r="21"/><text class="label" x="217" y="174">LS</text>
                        </g>
                        <g class="pad-key" id="R_STICK_PRESS" aria-label="Right stick press">
                            <title>Right stick press</title><circle class="button" cx="301" cy="211" r="31"/><circle class="stick-cap" cx="301" cy="211" r="21"/><text class="label" x="301" y="211">RS</text>
                        </g>

                        <g class="pad-key" id="Y" aria-label="Y">
                            <title>Y</title><circle class="button" cx="373" cy="142" r="17"/><text class="label" x="373" y="142">Y</text>
                        </g>
                        <g class="pad-key" id="X" aria-label="X">
                            <title>X</title><circle class="button" cx="405" cy="110" r="17"/><text class="label" x="405" y="110">X</text>
                        </g>
                        <g class="pad-key" id="B" aria-label="B">
                            <title>B</title><circle class="button" cx="405" cy="174" r="17"/><text class="label" x="405" y="174">B</text>
                        </g>
                        <g class="pad-key" id="A" aria-label="A">
                            <title>A</title><circle class="button" cx="437" cy="142" r="17"/><text class="label" x="437" y="142">A</text>
                        </g>

                        <g class="pad-key" id="MINUS" aria-label="Minus">
                            <title>Minus</title><rect class="button" x="237" y="124" width="25" height="16" rx="8"/><text class="label" x="249" y="132">−</text>
                        </g>
                        <g class="pad-key" id="PLUS" aria-label="Plus">
                            <title>Plus</title><rect class="button" x="281" y="124" width="25" height="16" rx="8"/><text class="label" x="293" y="132">+</text>
                        </g>
                        <g class="pad-key" id="CAPTURE" aria-label="Capture">
                            <title>Capture</title><circle class="button" cx="250" cy="211" r="10"/><text class="label" x="250" y="211">□</text>
                        </g>
                        <g class="pad-key" id="HOME" aria-label="Home">
                            <title>Home</title><circle class="button" cx="349" cy="211" r="13"/><text class="label" x="349" y="211">⌂</text>
                        </g>

                        <g class="pad-key" id="JCL_SL" aria-label="Left Joy-Con SL">
                            <title>Left Joy-Con SL</title><rect class="button" x="45" y="143" width="19" height="28" rx="6"/><text class="label" x="54" y="157">SL</text>
                        </g>
                        <g class="pad-key" id="JCL_SR" aria-label="Left Joy-Con SR">
                            <title>Left Joy-Con SR</title><rect class="button" x="66" y="177" width="19" height="28" rx="6"/><text class="label" x="75" y="191">SR</text>
                        </g>
                        <g class="pad-key" id="JCR_SL" aria-label="Right Joy-Con SL">
                            <title>Right Joy-Con SL</title><rect class="button" x="436" y="177" width="19" height="28" rx="6"/><text class="label" x="445" y="191">SL</text>
                        </g>
                        <g class="pad-key" id="JCR_SR" aria-label="Right Joy-Con SR">
                            <title>Right Joy-Con SR</title><rect class="button" x="457" y="143" width="19" height="28" rx="6"/><text class="label" x="466" y="157">SR</text>
                        </g>
                    </svg>
                </div>

                <div class="status-pane" id="ssim-pane" hidden>
                    <div class="ssim-title">Top SSIM matches</div>
                    <div id="ssim-rows"></div>
                </div>
            </div>
        </div>

        <script>
        const $ = (id) => document.getElementById(id);
        let activityStats = {};

        // Two largest units: "1d 16h", "1h 28m", "5:15", "45s"
        function formatDuration(ms) {
            const total = Math.max(0, Math.floor(ms / 1000));
            const d = Math.floor(total / 86400);
            const h = Math.floor((total % 86400) / 3600);
            const m = Math.floor((total % 3600) / 60);
            const s = total % 60;
            if (d > 0) return `${d}d ${h}h`;
            if (h > 0) return `${h}h ${m}m`;
            if (m > 0) return `${m}:${String(s).padStart(2, "0")}`;
            return `${s}s`;
        }

        function tickStats() {
            const now = Date.now();
            // Stats exclude time not hunting: the correction is added to the start,
            // and the clock freezes at the stop time while the hunt is stopped.
            const huntEnd = activityStats.hunt_stopped_at ?? now;
            const huntStart = typeof activityStats.hunt_started === "number"
                ? activityStats.hunt_started + (activityStats.hunt_correction_ms || 0)
                : undefined;
            const rows = [
                ["stat-hunt", "st-hunt", huntStart, (v) => formatDuration(huntEnd - v)],
                ["stat-uptime", "st-uptime", activityStats.bot_started, (v) => formatDuration(now - v)],
                ["stat-avg", "st-avg", activityStats.average_interval_ms, formatDuration],
                ["stat-last", "st-last", activityStats.last_encounter, (v) => formatDuration(now - v)],
            ];
            for (const [box, out, value, fmt] of rows) {
                const ok = typeof value === "number";
                $(box).hidden = !ok;
                if (ok) $(out).textContent = fmt(value);
            }
        }

        function renderStatus(status) {
            const pane = $("status-pane");
            if (!status || !status.name) {
                pane.hidden = true;
                return;
            }

            $("st-game").textContent = status.name;
            $("st-details").textContent = status.details || "";
            $("st-details").hidden = !status.details;

            // "123 resets" / "123 encounters" -> labelled number; anything else is shown as-is
            const match = /^(\d+)\s+(\w+)$/.exec(status.state || "");
            $("stat-count").hidden = !status.state;
            if (match) {
                $("st-count-label").textContent = match[2].charAt(0).toUpperCase() + match[2].slice(1);
                $("st-count").textContent = Number(match[1]).toLocaleString();
            } else if (status.state) {
                $("st-count-label").textContent = "Status";
                $("st-count").textContent = status.state;
            }

            pane.hidden = false;
        }

        async function updateStatus() {
            try {
                const res = await fetch("/api/user_status", { cache: "no-store" });
                if (!res.ok) throw new Error(res.status);
                renderStatus(await res.json());
            } catch (e) {
                // Keep the last known status on transient failures
            }
        }

        async function updateActivityStats() {
            try {
                const res = await fetch("/api/activity_stats", { cache: "no-store" });
                if (!res.ok) throw new Error(res.status);
                activityStats = await res.json();
                tickStats();
            } catch (e) {
                // Keep the last known stats on transient failures
            }
        }

        async function updateViewers() {
            try {
                const res = await fetch("/api/viewers", { cache: "no-store" });
                const data = await res.json();
                $("viewer-count").textContent = data.viewers;
            } catch (e) {
                $("viewer-count").textContent = "–";
            }
        }

        function refresh() {
            updateStatus();
            updateActivityStats();
            updateViewers();
        }

        // Reload the feed once the server comes back after being unreachable
        const feed = $("feed");
        let serverUp = true;

        function reloadFeed() {
            feed.src = "/api/stream_endpoint?t=" + Date.now();
        }

        async function checkServer() {
            let up = false;
            try {
                up = (await fetch("/api/viewers", { cache: "no-store" })).ok;
            } catch (e) {}
            if (up && !serverUp) reloadFeed();
            serverUp = up;
        }

        feed.addEventListener("error", () => { serverUp = false; });

        // Panels below the feed: reserve their height so both fit on screen
        const wide = window.matchMedia("(min-width: 1100px)");
        function updateReserve() {
            const side = $("side");
            const reserve = wide.matches ? 0 : side.getBoundingClientRect().height + (side.offsetParent && side.offsetHeight ? 16 : 0);
            document.documentElement.style.setProperty("--reserve", reserve + "px");
        }
        new ResizeObserver(updateReserve).observe($("side"));
        wide.addEventListener("change", updateReserve);

        // SSIM panel
        let ssimTimer = null;
        async function updateSsim() {
            try {
                const res = await fetch("/api/ssim_data", { cache: "no-store" });
                if (!res.ok) throw new Error(res.status);
                const data = await res.json();
                const rows = $("ssim-rows");
                rows.replaceChildren(...data.scores.map((s) => {
                    const row = document.createElement("div");
                    row.className = "ssim-row";
                    const name = document.createElement("span");
                    name.textContent = s.scene;
                    const val = document.createElement("span");
                    val.textContent = s.score.toFixed(4);
                    row.append(name, val);
                    return row;
                }));
                if (!data.scores.length) rows.textContent = "No data";
            } catch (e) {
                // Keep previous values on transient failures
            }
        }

        $("ssim-toggle").addEventListener("click", () => {
            const pane = $("ssim-pane");
            pane.hidden = !pane.hidden;
            const label = pane.hidden ? "Show SSIM scores" : "Hide SSIM scores";
            $("ssim-toggle").title = label;
            $("ssim-toggle").setAttribute("aria-label", label);
            $("ssim-toggle").setAttribute("aria-pressed", String(!pane.hidden));
            clearInterval(ssimTimer);
            if (!pane.hidden) {
                updateSsim();
                ssimTimer = setInterval(updateSsim, 1000);
            }
        });

        // Audio: the stream only connects while unmuted, so the server captures on demand
        let muted = true;
        function setMuted(value) {
            muted = value;
            const audio = $("audio");
            const btn = $("mute-toggle");
            const label = muted ? "Unmute audio" : "Mute audio";
            btn.innerHTML = muted ? "&#128263;" : "&#128266;";
            btn.title = label;
            btn.setAttribute("aria-label", label);
            btn.setAttribute("aria-pressed", String(!muted));
            if (muted) {
                audio.pause();
                audio.removeAttribute("src");
                audio.load();
            } else {
                audio.src = "/api/audio_stream?t=" + Date.now();
                audio.play().catch(() => setMuted(true));
            }
        }
        $("audio").addEventListener("error", () => {
            if (!muted) setTimeout(() => { if (!muted) setMuted(false); }, 3000);
        });
        $("mute-toggle").addEventListener("click", () => setMuted(!muted));

        // Input display
        const padEls = {};
        for (const el of $("pad").querySelectorAll(".pad-key[id]")) {
            padEls[el.id] = el;
        }
        let inputTimer = null;
        async function updateInputs() {
            try {
                const res = await fetch("/api/inputs", { cache: "no-store" });
                if (!res.ok) throw new Error(res.status);
                const pressed = new Set((await res.json()).pressed);
                for (const [name, el] of Object.entries(padEls)) {
                    el.classList.toggle("on", pressed.has(name));
                }
            } catch (e) {
                // Keep previous state on transient failures
            }
        }

        function setInputsVisible(visible) {
            $("input-pane").hidden = !visible;
            const label = visible ? "Hide inputs" : "Show inputs";
            $("input-toggle").title = label;
            $("input-toggle").setAttribute("aria-label", label);
            $("input-toggle").setAttribute("aria-pressed", String(visible));
            clearInterval(inputTimer);
            if (visible) {
                updateInputs();
                inputTimer = setInterval(updateInputs, 100);
            }
            try { localStorage.setItem("showInputs", visible ? "1" : "0"); } catch (e) {}
        }
        $("input-toggle").addEventListener("click", () => setInputsVisible($("input-pane").hidden));
        try { if (localStorage.getItem("showInputs") === "1") setInputsVisible(true); } catch (e) {}

        refresh();
        setInterval(refresh, 3000);
        setInterval(checkServer, 2000);
        setInterval(tickStats, 1000);
        </script>

    </body>
</html>
